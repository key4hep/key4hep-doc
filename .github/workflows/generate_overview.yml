name: Generate overview
on:
  workflow_call:
    inputs:
      ref:
        description: The git ref to check out
        type: string
        required: true
      collect-script:
        description: Python script that collects component info and writes JSON
        type: string
        required: true
      stub:
        description: Markdown stub with page title and intro text (relative to repo root)
        type: string
        required: true
      output:
        description: Path for the generated output file (relative to repo root)
        type: string
        required: true
      filter-config:
        description: Path to a YAML filter config file
        type: string
        required: true
      item-label:
        description: Singular label for each item (e.g. algorithm or processor)
        type: string
        default: algorithm
      property-label:
        description: Singular label for each property (e.g. property or parameter)
        type: string
        default: property

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Collect github repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh search repos --owner=key4hep --archived=false --visibility=public --json name,url --limit 100 > key4hep_repositories.json
          gh search repos --owner=hep-fcc --archived=false --visibility=public --json name,url --limit 100 > hep-fcc_repositories.json
          gh search repos --owner=ilcsoft --archived=false --visibility=public --json name,url --limit 100 > ilcsoft_repositories.json
      - uses: cvmfs-contrib/github-action-cvmfs@10197e000cc0add8e54ac4fb73d3ed44e2de72b4 # v5.5
      - uses: aidasoft/run-lcg-view@b4da52e1c5ccb70a60ad4e7216de0a90664d5849 # v6.0.2
        with:
          container: ubuntu2404
          view-path: /cvmfs/sw-nightlies.hsf.org/key4hep
          run: |
            args=(--item-label "${{ inputs.item-label }}" --property-label "${{ inputs.property-label }}")
            bash scripts/generate_overview.sh \
              "${{ inputs.collect-script }}" \
              "${{ inputs.stub }}" \
              --output "${{ inputs.output }}" \
              --filter-config ${{ inputs.filter-config }} \
              --repo-maps *_repositories.json \
              "${args[@]}"
            chmod a+r "${{ inputs.output }}"
      - name: Compute artifact name
        id: artifact-name
        run: echo "name=$(echo '${{ inputs.output }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ inputs.output }}
