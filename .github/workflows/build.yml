name: Build preview
on:
  workflow_call:
    inputs:
      ref:
        description: The git ref for which the preview should be built
        type: string
        required: true
      linkcheck:
        description: Run the link-check and fail the workflow if it fails
        type: boolean
        required: false
        default: true
      upload-artifact:
        description: Upload an artifact for downstream consumption
        type: boolean
        required: false
        default: true
      pr-number:
        description: The PR number for identifying dependent PRs
        type: string
        required: false
        default: ''
      generate-overviews:
        description: Run the overview generation jobs (not needed for linkcheck-only runs)
        type: boolean
        required: false
        default: true

# The build executes the code of the built ref, so it must not need more than
# reading a public repository. pull-requests is for fetching upstream PR sources
permissions:
  contents: read
  pull-requests: read

jobs:
  generate-alg-overview:
    if: ${{ inputs.generate-overviews }}
    uses: ./.github/workflows/generate_overview.yml
    with:
      ref: ${{ inputs.ref }}
      collect-script: scripts/collect_gaudi_alg_info.py
      stub: docs/algorithm-overview.stub.md
      output: docs/algorithm-overview.md
      item-label: algorithm
      property-label: property
      filter-config: scripts/filter_gaudi.yaml

  generate-proc-overview:
    if: ${{ inputs.generate-overviews }}
    uses: ./.github/workflows/generate_overview.yml
    with:
      ref: ${{ inputs.ref }}
      collect-script: scripts/collect_marlin_processor_info.py
      stub: docs/processor-overview.stub.md
      output: docs/processor-overview.md
      item-label: processor
      property-label: parameter
      filter-config: scripts/filter_marlin.yaml

  build:
    needs: [generate-alg-overview, generate-proc-overview]
    # The overview jobs are skipped for linkcheck-only runs and a skipped job
    # otherwise propagates the skip to everything that needs it
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: 3.12
        cache: pip
    - name: Install Requirements
      run: |
          pip install --upgrade pip
          pip install -r requirements.txt
    - name: Download algorithm overview
      if: ${{ inputs.generate-overviews }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: docs-algorithm-overview.md
        path: docs/
    - name: Download processor overview
      if: ${{ inputs.generate-overviews }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: docs-processor-overview.md
        path: docs/
    - name: Fetch external sources from upstream PR
      if: ${{ inputs.pr-number != '' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        bash scripts/fetch_upstream_pr_sources.sh ${{ inputs.pr-number }}
    - name: Fetch external sources
      run: |
        bash scripts/fetch_external_sources.sh
    - name: Build documentation
      run: |
        sphinx-build -M html docs build
    - name: Run linkcheck
      if: ${{ inputs.linkcheck }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        sphinx-build -b linkcheck docs linkcheck
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      if: ${{ inputs.upload-artifact }}
      with:
        path: build/html
