name: Deploy PR preview

on:
  workflow_run:
    # Matched by name, so this has to be kept in sync with pr-build.yml
    workflows: ["Build PR preview"]
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  # Interrupting a deployment can leave the preview branch half updated
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write

    steps:
      # Only the artifacts of the build are used here, never the code of the
      # PR, so this checks out the branch this workflow itself runs from
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-number
          path: pr_number
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine PR number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          number=$(cat pr_number/pr_number.txt)
          if [[ ! "${number}" =~ ^[0-9]+$ ]]; then
            echo "::error::'${number}' is not a valid PR number"
            exit 1
          fi
          # The workflow file of the build comes from the PR as well, so check
          # that the reported number really belongs to the PR that was built
          # before using it as a deployment target
          pr_head=$(gh pr view "${number}" --repo "${GITHUB_REPOSITORY}" \
            --json headRepositoryOwner,headRepository,headRefName \
            --jq '"\(.headRepositoryOwner.login)/\(.headRepository.name)#\(.headRefName)"')
          if [[ "${pr_head}" != "${HEAD_REPO}#${HEAD_BRANCH}" ]]; then
            echo "::error::PR #${number} (${pr_head}) does not match the build (${HEAD_REPO}#${HEAD_BRANCH})"
            exit 1
          fi
          echo "number=${number}" >> "${GITHUB_OUTPUT}"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-pages
          path: doc_artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack documentation
        run: |
          mkdir -p pr-preview-unpacked
          tar -xvf doc_artifact/artifact.tar --directory pr-preview-unpacked
          rm -r doc_artifact

      - name: Deploy Preview
        id: deploy
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: pr-preview-unpacked
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          deploy-repository: "key4hep/key4hep-doc"
          pr-number: ${{ steps.pr.outputs.number }}
          action: deploy
          # The comment of the action needs a PR in the event context, which
          # does not exist for workflow_run, so it is done separately below
          comment: false

      - name: Comment preview URL
        uses: marocchino/sticky-pull-request-comment@67d0dec7b07ed060a405f9b2a64b8ab319fdd7db # v2.9.2
        with:
          header: pr-preview
          number: ${{ steps.pr.outputs.number }}
          message: |
            :rocket: Documentation preview: ${{ steps.deploy.outputs.preview-url }}

            It becomes available once the github pages deployment has completed,
            is updated on every push and is removed once this PR is closed.
