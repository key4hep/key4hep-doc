name: Build/Deploy PR preview

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      linkcheck: false
      pr-number: ${{ github.event.number }}

  linkcheck:
    if: contains(fromJSON('["opened", "reopened", "synchronize"]'), github.event.action)
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      linkcheck: true
      upload-artifact: false
      generate-overviews: false
      pr-number: ${{ github.event.number }}

  deploy-preview:
    needs: build-preview
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-pages
          path: doc_artifact

      - name: Unpack documentation
        run: |
          mkdir -p pr-preview-unpacked
          tar -xvf doc_artifact/artifact.tar --directory pr-preview-unpacked
          rm -r doc_artifact

      - name: Deploy Preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        if: contains(fromJSON('["opened", "reopened", "synchronize"]'), github.event.action)
        with:
          source-dir: pr-preview-unpacked
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          deploy-repository: "key4hep/key4hep-doc"
          action: auto

      - name: Remove Preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        if: github.event.action == 'closed' && !github.event.pull_request.merged
        with:
          source-dir: pr-preview-unpacked
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          deploy-repository: "key4hep/key4hep-doc"
          action: remove
